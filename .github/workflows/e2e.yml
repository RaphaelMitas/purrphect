name: E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 3

jobs:
  # macOS runners are scarce: pull requests test on Android, iOS runs on request and in every release's ios job.
  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Install Maestro
        uses: ./tooling/github/maestro

      - name: Build app and run Maestro flows
        run: bash tooling/e2e/run.sh ios

      # Maestro's failure bundle sits in hidden dirs, which upload-artifact drops by default.
      - name: Upload Maestro results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios
          path: apps/dart/e2e/results/
          include-hidden-files: true
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Build APK
        id: build
        uses: ./tooling/github/build-android-apk

      - name: Install Maestro
        uses: ./tooling/github/maestro

      - name: Run Maestro flows
        uses: ./tooling/github/android-emulator
        with:
          script: |
            adb install "${{ steps.build.outputs.apk-path }}"
            cd apps/dart && pnpm e2e

      - name: Upload Maestro results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android
          path: apps/dart/e2e/results/
          include-hidden-files: true
          retention-days: 7
