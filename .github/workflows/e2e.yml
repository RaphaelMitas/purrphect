name: E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 3

jobs:
  # macOS runners are scarce: pull requests test on Android, iOS runs on request and in every release's screenshot job.
  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      # Boots while the app builds.
      - name: Create iOS simulator
        id: sim
        uses: ./tooling/github/ios-simulator
        with:
          device: "^iPad Air 13-inch"

      - name: Build app
        id: build
        uses: ./tooling/github/build-ios-sim

      - name: Install Maestro
        uses: ./tooling/github/maestro

      - name: Install app
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          APP: ${{ steps.build.outputs.app-path }}
        run: |
          xcrun simctl bootstatus "$UDID"
          xcrun simctl install "$UDID" "$APP"

      - name: Run Maestro flows
        working-directory: apps/dart
        run: pnpm e2e --device "${{ steps.sim.outputs.udid }}"

      # Maestro's failure bundle sits in hidden dirs, which upload-artifact drops by default.
      - name: Upload Maestro results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios
          path: apps/dart/e2e/results/
          include-hidden-files: true
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Build APK
        id: build
        uses: ./tooling/github/build-android-apk

      - name: Install Maestro
        uses: ./tooling/github/maestro

      # ANR dialogs from the slow emulator overlay the app and hide it from Maestro.
      - name: Run Maestro flows
        uses: ./tooling/github/android-emulator
        with:
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb install "${{ steps.build.outputs.apk-path }}"
            cd apps/dart && pnpm e2e

      - name: Upload Maestro results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android
          path: apps/dart/e2e/results/
          include-hidden-files: true
          retention-days: 7
