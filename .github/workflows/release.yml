name: Release

# Releases when apps/dart/app.json's version has no tag yet and the RELEASES_ENABLED repo variable is "true".
# A manual run on main for a version that is already tagged re-publishes its listings without rebuilding.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only capture and compose screenshots; tag, build, upload and open nothing"
        type: boolean
        default: true
      publish:
        description: "Stores whose listing to update and submit; re-publishing one leaves the other's review alone"
        type: choice
        options: [both, android, ios]
        default: both

permissions:
  contents: read

concurrency:
  group: ${{ inputs.dry_run && format('release-dry-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

env:
  EAS_CLI: eas-cli@27.5.0

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide whether this is a release
        id: decide
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          TAG="v$(jq -r .expo.version apps/dart/app.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases run from main; use dry_run on other branches."
            exit 1
          else
            git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null && found=0 || found=$?
            case $found in
              0)
                if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                  echo "$TAG already exists; re-publishing it." && echo "release=true" >> "$GITHUB_OUTPUT"
                else
                  echo "$TAG already exists; not a release." && echo "release=false" >> "$GITHUB_OUTPUT"
                fi
                ;;
              2) echo "release=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::Could not check for $TAG" && exit 1 ;;
            esac
          fi

  # --local keeps both release builds off the Expo plan's build quota.
  android:
    needs: check
    if: needs.check.outputs.release == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version-code: ${{ steps.version.outputs.version-code }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      # A re-run after the release is tagged must not build and submit this version again.
      - name: Check for an earlier ship
        id: earlier
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          tags=$(git ls-remote --tags origin "refs/tags/$TAG")
          [ -z "$tags" ] || echo "shipped=true" >> "$GITHUB_OUTPUT"

      - name: Android toolchain
        if: "!steps.earlier.outputs.shipped"
        uses: ./tooling/github/android-toolchain

      - name: Build and submit
        if: "!steps.earlier.outputs.shipped"
        working-directory: apps/dart
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm dlx "$EAS_CLI" build --platform android --profile production --local --non-interactive --output "$RUNNER_TEMP/dart.aab"
          pnpm dlx "$EAS_CLI" submit --platform android --profile production --non-interactive --path "$RUNNER_TEMP/dart.aab"

      # Local builds leave no record on EAS, so publish-android takes the versionCode from here.
      - name: Read the versionCode
        id: version
        working-directory: apps/dart
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          CODE=$(pnpm dlx "$EAS_CLI" build:version:get --platform android --profile production --json | jq -r '.versionCode // empty')
          [ -n "$CODE" ] || { echo "::error::Could not read the Android versionCode from EAS."; exit 1; }
          echo "version-code=$CODE" >> "$GITHUB_OUTPUT"

  # One macOS job ships the build and then captures the screenshots, since macOS runners are scarce.
  ios:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 150
    outputs:
      shipped: ${{ steps.earlier.outputs.shipped || steps.ship.outputs.shipped }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      # A re-run after the release is tagged must not build and submit this version again.
      - name: Check for an earlier ship
        id: earlier
        if: "!inputs.dry_run"
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          tags=$(git ls-remote --tags origin "refs/tags/$TAG")
          [ -z "$tags" ] || echo "shipped=true" >> "$GITHUB_OUTPUT"

      - name: Build and submit
        id: ship
        if: "!inputs.dry_run && !steps.earlier.outputs.shipped"
        working-directory: apps/dart
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm dlx "$EAS_CLI" build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/dart.ipa"
          pnpm dlx "$EAS_CLI" submit --platform ios --profile production --non-interactive --path "$RUNNER_TEMP/dart.ipa"
          echo "shipped=true" >> "$GITHUB_OUTPUT"

      # Re-publishing Android alone needs no iOS captures; compose keeps the previous ones.
      - name: Build simulator app
        if: inputs.publish != 'android'
        id: app
        uses: ./tooling/github/build-ios-sim
        env:
          EXPO_PUBLIC_DEMO: "1"

      - name: Install Maestro
        if: inputs.publish != 'android'
        uses: ./tooling/github/maestro

      # One simulator at a time: Maestro's XCTest driver listens on a fixed port.
      - name: Create iPhone
        if: inputs.publish != 'android'
        id: iphone
        uses: ./tooling/github/ios-simulator
        with:
          device: "^iPhone [0-9]+ Pro Max$"

      - name: Capture iPhone
        if: inputs.publish != 'android'
        env:
          UDID: ${{ steps.iphone.outputs.udid }}
          APP: ${{ steps.app.outputs.app-path }}
        run: |
          bash apps/dart/screenshots/capture.sh iphone "$RUNNER_TEMP/captures" "$UDID" "$APP"
          xcrun simctl shutdown "$UDID"

      - name: Create iPad
        if: inputs.publish != 'android'
        id: ipad
        uses: ./tooling/github/ios-simulator
        with:
          device: "^iPad Pro 13-inch"

      - name: Capture iPad
        if: inputs.publish != 'android'
        env:
          UDID: ${{ steps.ipad.outputs.udid }}
          APP: ${{ steps.app.outputs.app-path }}
        run: bash apps/dart/screenshots/capture.sh ipad "$RUNNER_TEMP/captures" "$UDID" "$APP"

      - name: Upload captures
        if: always() && inputs.publish != 'android'
        uses: actions/upload-artifact@v7
        with:
          name: captures-ios
          path: ${{ runner.temp }}/captures/
          retention-days: 30

  # Tagged only after both stores have the build, so a failed run can simply be re-run.
  tag:
    needs: [check, android, ios]
    if: "!cancelled() && needs.android.result == 'success' && needs.ios.outputs.shipped == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  screenshots-android:
    needs: check
    if: needs.check.outputs.release == 'true' && inputs.publish != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Build APK
        id: apk
        uses: ./tooling/github/build-android-apk
        env:
          EXPO_PUBLIC_DEMO: "1"

      - name: Install Maestro
        uses: ./tooling/github/maestro

      # The runner's avdmanager (cmdline-tools 12.0) knows no Pixel phone newer than the 7 Pro.
      - name: Capture Android phone
        uses: ./tooling/github/android-emulator
        with:
          profile: pixel_7_pro
          script: bash apps/dart/screenshots/capture.sh android-phone "$RUNNER_TEMP/captures" emulator-5554 "${{ steps.apk.outputs.apk-path }}"

      - name: Capture Android tablet
        uses: ./tooling/github/android-emulator
        with:
          profile: pixel_tablet
          script: bash apps/dart/screenshots/capture.sh android-tablet "$RUNNER_TEMP/captures" emulator-5554 "${{ steps.apk.outputs.apk-path }}"

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: captures-android
          path: ${{ runner.temp }}/captures/
          retention-days: 30

  # The manifest keeps a failed platform's previous screenshots.
  compose:
    needs: [check, ios, screenshots-android]
    if: >-
      !cancelled() && needs.check.outputs.release == 'true' &&
      (needs.ios.result == 'success' || needs.screenshots-android.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Install Chromium
        run: pnpm --filter @purrphect/store-assets exec playwright install --with-deps chromium

      - name: Download captures
        uses: actions/download-artifact@v8
        with:
          pattern: captures-*
          path: captures
          merge-multiple: true

      - name: Compose rigs
        run: |
          pnpm --filter @purrphect/store-assets compose "$GITHUB_WORKSPACE/captures"
          pnpm --filter @purrphect/store-assets feature "$RUNNER_TEMP/play"

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: store-screenshots
          path: apps/dart-web/public/screenshots/
          retention-days: 30

      - name: Upload Play feature graphics
        uses: actions/upload-artifact@v7
        with:
          name: play-graphics
          path: ${{ runner.temp }}/play/
          retention-days: 30

  website:
    needs: [check, tag, compose]
    if: "!cancelled() && needs.tag.result == 'success' && needs.compose.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download screenshots
        uses: actions/download-artifact@v8
        with:
          name: store-screenshots
          path: store-screenshots

      - name: Attach screenshots to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          (cd store-screenshots && zip -qr "$RUNNER_TEMP/dart-purrphect-$TAG-screenshots.zip" .)
          gh release upload "$TAG" "$RUNNER_TEMP/dart-purrphect-$TAG-screenshots.zip" --clobber

      # PRs opened with GITHUB_TOKEN don't trigger CI; this one only changes images.
      - name: Open a PR with the website screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          rm -rf apps/dart-web/public/screenshots
          mv store-screenshots apps/dart-web/public/screenshots
          git add -A apps/dart-web/public/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          BRANCH="screenshots/$TAG"
          git switch -c "$BRANCH"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update screenshots for $TAG"
          git push --force origin "$BRANCH"
          gh pr view "$BRANCH" > /dev/null 2>&1 || gh pr create --base main --head "$BRANCH" \
            --title "Update screenshots for $TAG" \
            --body "Store screenshots composed by the $TAG release run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  publish-ios:
    needs: [check, tag, ios, compose]
    if: >-
      !cancelled() && needs.tag.result == 'success' && inputs.publish != 'android' &&
      needs.ios.result == 'success' && needs.compose.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/fastlane/Gemfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download screenshots
        uses: actions/download-artifact@v8
        with:
          name: store-screenshots
          path: store-screenshots

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0.9"
          bundler-cache: true

      # iphone-duo is the committed hand capture; without it here the screenshot sync deletes it from the listing.
      - name: Arrange deliver inputs
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p screenshots/en-US fastlane && touch fastlane/Deliverfile
          for device in iphone iphone-duo ipad; do
            for f in store-screenshots/$device/*.png; do cp "$f" "screenshots/en-US/$device-$(basename "$f")"; done
          done
          jq -n --arg kid "$ASC_API_KEY_ID" --arg iss "$ASC_API_ISSUER_ID" --arg key "$ASC_API_KEY_P8" \
            '{key_id: $kid, issuer_id: $iss, key: $key}' > "$RUNNER_TEMP/asc.json"

      # Sync compares checksums, so a re-run uploads no duplicates; reject_if_possible pulls a pending
      # submission so a re-run can still fix the listing. Only "build not ready" errors are worth retrying.
      - name: Update listing and submit for review
        env:
          TAG: ${{ needs.check.outputs.tag }}
          FASTLANE_ENABLE_BETA_DELIVER_SYNC_SCREENSHOTS: "true"
        run: |
          ARGS=(
            --app_identifier com.purrphect.dart
            --app_version "${TAG#v}"
            --api_key_path "$RUNNER_TEMP/asc.json"
            --metadata_path apps/dart/store
            --screenshots_path screenshots
            --sync_screenshots true
            --skip_binary_upload true
            --submit_for_review true
            --automatic_release true
            --reject_if_possible true
            --run_precheck_before_submit false
            --precheck_include_in_app_purchases false
            --submission_information '{"add_id_info_uses_idfa": false}'
            --force true
          )
          set -o pipefail
          for attempt in $(seq 1 12); do
            if bundle exec fastlane deliver "${ARGS[@]}" 2>&1 | tee deliver.log; then
              exit 0
            fi
            if ! grep -qiE "couldn'?t find build|could not find build|no build|build.*not.*(found|ready)|timed? ?out.*(build|processing)" deliver.log; then
              echo "::error::deliver failed with a non-processing error; see the log above."
              exit 1
            fi
            echo "Attempt $attempt: the build is still processing; retrying in 5 minutes."
            sleep 300
          done
          echo "::error::Could not submit ${TAG#v} for review after 12 attempts."
          exit 1

  # Promoting from internal sends the release to Google review. Play keeps production locked until the app has run a
  # closed test (12 testers, 14 days), so releases go to closed testing (alpha) until then; switch to production after.
  publish-android:
    needs: [check, tag, android, screenshots-android, compose]
    if: >-
      !cancelled() && needs.tag.result == 'success' && inputs.publish != 'ios' &&
      needs.screenshots-android.result == 'success' && needs.compose.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/fastlane/Gemfile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download screenshots
        uses: actions/download-artifact@v8
        with:
          name: store-screenshots
          path: store-screenshots

      - name: Download feature graphics
        uses: actions/download-artifact@v8
        with:
          name: play-graphics
          path: play-graphics

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0.9"
          bundler-cache: true

      # supply sends files verbatim, so $(cat) drops the trailing newline. One tablet set fills both tablet slots.
      - name: Update listing and promote to closed testing
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ needs.android.outputs.version-code }}
        run: |
          for dir in apps/dart/store/*/; do
            locale=$(basename "$dir")
            out="play/$locale"
            mkdir -p "$out/changelogs" "$out/images"
            printf '%s' "$(cat "${dir}play/title.txt")" > "$out/title.txt"
            printf '%s' "$(cat "${dir}play/short_description.txt")" > "$out/short_description.txt"
            printf '%s' "$(cat "${dir}description.txt")" > "$out/full_description.txt"
            printf '%s' "$(cat "${dir}release_notes.txt")" > "$out/changelogs/default.txt"
            cp "play-graphics/$locale/featureGraphic.png" "$out/images/featureGraphic.png"
          done
          images=play/en-US/images
          mkdir -p "$images/phoneScreenshots" "$images/sevenInchScreenshots" "$images/tenInchScreenshots"
          cp store-screenshots/android-phone/*.png "$images/phoneScreenshots/"
          cp store-screenshots/android-tablet/*.png "$images/sevenInchScreenshots/"
          cp store-screenshots/android-tablet/*.png "$images/tenInchScreenshots/"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          bundle exec fastlane supply --package_name com.purrphect.dart --json_key "$RUNNER_TEMP/play.json" \
            --metadata_path play --track internal --track_promote_to alpha --version_code "$VERSION_CODE" \
            --rescue_changes_not_sent_for_review false --skip_upload_apk true --skip_upload_aab true
