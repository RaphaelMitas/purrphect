appId: com.purrphect.dart
name: Store screenshots
---
- launchApp:
    clearState: true
# A link that arrives before the root layout has mounted its navigator is dropped.
- extendedWaitUntil:
    visible: "New game"
    timeout: 60000
- openLink: dartpurrphect://demo
# iOS asks before a custom scheme opens the app, sometimes several seconds later, and only
# the first time, so a retry finds the demo already open.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Open|Continue match.*"
          timeout: 20000
      - tapOn:
          text: "Open"
          optional: true
# iOS reads a pressable card as one label, e.g. "Continue match, 501 · …, Discard, Resume".
- extendedWaitUntil:
    visible: "Continue match.*"
    timeout: 60000
# Tablets are shown in landscape, like the Android tablet, which boots that way. Rotating
# only now keeps the iOS prompt above in portrait, where Maestro's tap reaches it.
- runFlow:
    when:
      true: ${DEVICE == 'ipad'}
    commands:
      - setOrientation: LANDSCAPE_LEFT
      - waitForAnimationToEnd

- tapOn: "Continue match.*"
- extendedWaitUntil:
    visible: "Tiles"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: board

- tapOn: "Tiles"
- tapOn: "25"
- waitForAnimationToEnd
- takeScreenshot: tiles

- tapOn: "Board"
- waitForAnimationToEnd
- takeScreenshot: checkout

- runFlow:
    file: home.yaml
- tapOn: "Thursday crew.*"
- extendedWaitUntil:
    visible: "Who's playing\\?"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: lobby

- runFlow:
    file: home.yaml
- tapOn: "Statistics"
- extendedWaitUntil:
    visible: "Average per match"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: stats

- scrollUntilVisible:
    element: "Open Mia's player card"
    direction: DOWN
- tapOn: "Open Mia's player card"
- extendedWaitUntil:
    visible: "Lv\\. .*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: player
