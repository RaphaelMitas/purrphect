<!doctype html>
<html lang="en" style="{{VARS}} {{THEME}}">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Nunito";
        font-weight: 800;
        src: url("{{FONT}}") format("truetype");
      }
      :root {
        --bezel: #2e2129;
      }
      html,
      body {
        margin: 0;
        width: var(--w);
        height: var(--h);
        overflow: hidden;
      }
      body {
        position: relative;
        background: hsl(var(--background));
        font-family: "Nunito", sans-serif;
        color: hsl(var(--foreground));
      }
      .blob {
        position: absolute;
        border-radius: 50%;
      }
      .dot {
        position: absolute;
        width: calc(var(--u) * 2.4);
        height: calc(var(--u) * 2.4);
        border-radius: 50%;
      }
      header {
        position: absolute;
        top: 0;
        left: var(--side);
        right: var(--side);
        height: var(--header);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        margin: 0;
        font-weight: 800;
        font-size: var(--font);
        line-height: 1.08;
        letter-spacing: -0.01em;
        text-align: center;
        text-wrap: balance;
      }
      .cat {
        position: absolute;
        left: var(--cat-x);
        top: var(--cat-y);
        width: var(--cat-w);
        filter: drop-shadow(0 calc(var(--u) * 0.6) calc(var(--u) * 1.2) hsl(var(--foreground) / 0.18));
      }
      .cat svg {
        display: block;
        width: 100%;
      }
      .device {
        position: absolute;
        left: var(--dev-x);
        top: var(--dev-y);
        padding: var(--bezel-w);
        border-radius: calc(var(--screen-radius) + var(--bezel-w));
        background: var(--bezel);
        box-shadow:
          inset 0 0 0 calc(var(--u) * 0.35) rgba(255, 255, 255, 0.12),
          0 calc(var(--u) * 3) calc(var(--u) * 8) hsl(var(--pink) / 0.28),
          0 calc(var(--u) * 1) calc(var(--u) * 2.5) hsl(var(--foreground) / 0.22);
      }
      .screen {
        display: block;
        /* Maestro tags rotated iPad captures with an EXIF orientation; capture.sh already turned the pixels. */
        image-orientation: none;
        width: var(--screen-w);
        height: var(--screen-h);
        border-radius: var(--screen-radius);
      }
      .island {
        position: absolute;
        left: 50%;
        background: #000;
        transform: translateX(-50%);
      }
      .iphone .island {
        top: calc(var(--bezel-w) + var(--screen-w) * 0.026);
        width: calc(var(--screen-w) * 0.285);
        height: calc(var(--screen-w) * 0.084);
        border-radius: calc(var(--screen-w) * 0.042);
      }
      .android .island {
        top: calc(var(--bezel-w) + var(--screen-w) * 0.03);
        width: calc(var(--screen-w) * 0.034);
        height: calc(var(--screen-w) * 0.034);
        border-radius: 50%;
      }
      .tablet .island {
        display: none;
      }
      .button {
        position: absolute;
        background: var(--bezel);
        border-radius: calc(var(--u) * 0.4);
      }
    </style>
  </head>
  <body>
    {{DECOR}}
    <header><h1>{{CAPTION}}</h1></header>
    <div class="cat">{{CAT}}</div>
    <div class="device {{FRAME}}">
      {{BUTTONS}}
      <img class="screen" src="{{SCREEN}}" alt="" />
      <div class="island"></div>
    </div>
  </body>
</html>
