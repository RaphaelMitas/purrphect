name: "iOS simulator"
description: "Create and start booting a fresh simulator: the newest matching device on the newest runtime that has one"

inputs:
  device:
    description: 'Regex for the device type name, e.g. "^iPad Air 13-inch"'
    required: true

outputs:
  udid:
    description: "The new simulator; run `xcrun simctl bootstatus` on it before use"
    value: ${{ steps.create.outputs.udid }}

runs:
  using: composite
  steps:
    - id: create
      shell: bash
      env:
        DEVICE: ${{ inputs.device }}
      run: |
        UDID=$(bash tooling/e2e/ios-simulator.sh "$DEVICE")
        echo "udid=$UDID" >> "$GITHUB_OUTPUT"
