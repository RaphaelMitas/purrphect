name: "Maestro"
description: "Install a pinned Maestro CLI and configure it for slow CI simulators"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        MAESTRO_VERSION: "2.3.0"
      run: |
        curl -fsSL https://get.maestro.mobile.dev | bash
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
        echo "MAESTRO_CLI_NO_ANALYTICS=1" >> "$GITHUB_ENV"
        echo "MAESTRO_DRIVER_STARTUP_TIMEOUT=240000" >> "$GITHUB_ENV"
