name: "Build iOS simulator app"
description: "Prebuild apps/dart and build a Release .app for the iOS simulator. Run ./tooling/github/setup first; env from the calling step reaches the JS bundle."

outputs:
  app-path:
    description: "Absolute path to the built .app"
    value: ${{ steps.build.outputs.app-path }}

runs:
  using: composite
  steps:
    - id: build
      shell: bash
      run: |
        APP=$(bash tooling/e2e/build-ios-sim.sh)
        echo "app-path=$APP" >> "$GITHUB_OUTPUT"
