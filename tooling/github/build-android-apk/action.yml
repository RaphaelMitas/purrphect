name: "Build Android APK"
description: "Prebuild apps/dart and build a debug-signed x86_64 release APK. Run ./tooling/github/setup first; env from the calling step reaches the JS bundle."

outputs:
  apk-path:
    description: "Absolute path to the built APK"
    value: ${{ steps.build.outputs.apk-path }}

runs:
  using: composite
  steps:
    - uses: ./tooling/github/android-toolchain

    - shell: bash
      working-directory: apps/dart
      run: pnpm expo prebuild --platform android --no-install

    # The Expo template signs release builds with the debug keystore, so the APK installs as-is.
    - id: build
      shell: bash
      working-directory: apps/dart/android
      run: |
        ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon \
          -x lintVitalRelease -x lintVitalAnalyzeRelease -x lintVitalReportRelease
        echo "apk-path=$PWD/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
