name: "Setup and install"
description: "pnpm, Node from .nvmrc, frozen install"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"
    - shell: bash
      run: pnpm install --frozen-lockfile
